[package]
name = "callboard"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "callboard"
path = "src/main.rs"

[[bin]]
name = "callboard-gui"
path = "src/bin/callboard-gui.rs"

[dependencies]
callboard-core.workspace = true
callboard-service.workspace = true
clap.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
humantime.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", default-features = false }
tempfile.workspace = true
rustix.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
