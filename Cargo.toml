[workspace]
members = ["crates/callboard-core", "crates/callboard-service", "crates/callboard"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = false

[workspace.dependencies]
callboard-core = { path = "crates/callboard-core" }
callboard-service = { path = "crates/callboard-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util", "io-std", "sync"] }
tempfile = "3"
rustix = { version = "1", features = ["event", "fs", "net", "process"] }
hyper = { version = "1.9", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
clap = { version = "4.6", features = ["derive"] }
