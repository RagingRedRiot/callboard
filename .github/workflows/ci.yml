name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: local check suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Run checks
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/checks.py --local
  complete:
    name: merge checks complete
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every check to succeed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
