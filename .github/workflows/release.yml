name: Release

# Publishes the archive users download: pushing a version tag (v0.2.0) builds
# a static x86_64 callboard and the callboard-gui desktop app, and attaches one
# archive holding both, with its checksum, to a GitHub release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match Cargo.toml's version and point at a commit on main, so
# only code that passed CI and review is released.
#
# The asset name carries no version, so
# releases/latest/download/callboard-x86_64-linux.tar.gz always names the
# newest release. That URL skips prereleases, so releases are never marked as one.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.98.1
  TARGET: x86_64-unknown-linux-musl
  ASSET: callboard-x86_64-linux.tar.gz

jobs:
  # Read-only token: building runs every dependency's build script. Only the
  # publish job below can write, and it runs nothing from the repository.
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # main's history, for the ancestry check.
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Tag matches Cargo.toml and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "callboard") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG points at $GITHUB_SHA, which is not on main."
            exit 1
          fi
      # musl-gcc compiles the bundled SQLite; musl links it all statically, so
      # the binary runs on any distribution's libc.
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      # No rust-cache: a clean build, with nothing restored from another run.
      - run: cargo build --release --locked --target "$TARGET" -p callboard --bin callboard
      - name: Binary is static and carries this commit's build
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/callboard"
          file "$binary"
          file "$binary" | grep -q 'static'
          commit=$(git rev-parse --short=12 HEAD)
          grep -qaF "$commit" "$binary"
          if grep -qaF "$commit-dirty" "$binary"; then exit 1; fi
      # The cross-user access fixture (docs/merge-checks.md), against the exact
      # binary being shipped.
      - run: scripts/security/run.sh "target/$TARGET/release/callboard"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: callboard
          path: target/${{ env.TARGET }}/release/callboard
          if-no-files-found: error

  # The desktop app can't be static: it loads the desktop's OpenGL and
  # Wayland/X11 libraries at run time. Built on the oldest supported runner,
  # so it needs only that glibc (2.35) and runs on older distributions too.
  # Same read-only token as `build`; the tag checks there gate publishing.
  # Waits for `build` so the archive carries its callboard: the static binary
  # the access fixture ran against, not a second build of it.
  package:
    name: package
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # No rust-cache: a clean build, with nothing restored from another run.
      - run: cargo build --release --locked -p callboard --bin callboard-gui
      # The app reports "Version mismatch" against a service from another
      # build; both binaries must carry this commit's build ID.
      - name: Binary runs, links only system libraries, and matches the build
        run: |
          set -euo pipefail
          ldd target/release/callboard-gui
          commit=$(git rev-parse --short=12 HEAD)
          grep -qaF "$commit" target/release/callboard-gui
          if grep -qaF "$commit-dirty" target/release/callboard-gui; then exit 1; fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: callboard
          path: static/
      # The fonts are compiled in, so their licenses travel with the binary.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p stage dist
          install -m 0755 static/callboard target/release/callboard-gui stage/
          cp LICENSE README.md \
            crates/callboard/assets/fonts/Inter-LICENSE.txt \
            crates/callboard/assets/fonts/Phosphor-LICENSE.txt stage/
          tar -C stage -czf "dist/$ASSET" \
            callboard callboard-gui LICENSE README.md Inter-LICENSE.txt Phosphor-LICENSE.txt
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          cat "dist/$ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # --verify-tag: publish only for the tag that triggered this run, never
      # create one. Fails if the release already exists, rather than replace
      # assets people may have verified.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --generate-notes
