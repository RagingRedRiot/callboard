name: Prepare release

# Starts a release from the Actions tab: Prepare release → Run workflow, then
# choose patch, minor, or major. It bumps the workspace version in Cargo.toml
# and Cargo.lock on a release/vX.Y.Z branch, ready for a pull request into
# main. Merging that pull request publishes the release
# (publish-release.yml).
#
# The branch is pushed, but the pull request is opened by hand from the link
# in the run's summary: a pull request opened with this workflow's token
# would start no workflows, so its required checks would never report.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: prepare-release

env:
  RUSTUP_TOOLCHAIN: 1.98.1

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Bump the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          version() { sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml; }
          current=$(version)
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Cargo.toml's workspace version \"$current\" is not X.Y.Z."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          if git ls-remote --exit-code origin "refs/tags/v$next" "refs/heads/release/v$next" > /dev/null; then
            echo "v$next is already tagged, or its release branch already exists."
            exit 1
          fi
          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \"$current\"$/version = \"$next\"/" Cargo.toml
          test "$(version)" = "$next"
          # Only the workspace crates' versions may change in the lockfile.
          cargo update --workspace
          changed=$(git diff --unified=0 -- Cargo.toml Cargo.lock | grep '^[-+][^-+]' || true)
          unexpected=$(printf '%s\n' "$changed" | grep -v '^[-+]version = ' || true)
          if [ -n "$unexpected" ]; then
            echo "Bumping the version changed more than version lines:"
            echo "$unexpected"
            exit 1
          fi
          echo "CURRENT=$current" >> "$GITHUB_ENV"
          echo "NEXT=$next" >> "$GITHUB_ENV"
      - name: Push the release branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/v$NEXT"
          git commit -am "Release $NEXT"
          git push origin "release/v$NEXT"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...release/v$NEXT?expand=1&title=Release%20$NEXT"
          {
            echo "### Release $NEXT is ready for a pull request"
            echo
            echo "Version $CURRENT → $NEXT on \`release/v$NEXT\`."
            echo "[Open the pull request]($url). Merging it publishes v$NEXT."
          } >> "$GITHUB_STEP_SUMMARY"
